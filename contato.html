<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - InfoTrust</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>📰 InfoTrust</h1>
        <p>Informação inteligente, sem ruído e com credibilidade</p>
    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="servicos.html">Serviços</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main>
        <section>
            <h2>Entre em contato</h2>
            <p>Preencha os campos abaixo. Nesta etapa, o formulário ainda não enviará os dados para um servidor, mas você já pode testar a validação do navegador.</p>

            <form>
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="assunto">Assunto:</label>
                <select id="assunto" name="assunto" required>
                    <option value="">Selecione</option>
                    <option value="duvida">Dúvida sobre os serviços</option>
                    <option value="sugestao">Sugestão de melhoria</option>
                    <option value="reportar">Reportar problema</option>
                    <option value="outro">Outro</option>
                </select>

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Projeto acadêmico - Programação Web</p>
    </footer>
</body>
</html>
